[package]
name = "mini_erp"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["core", "modules/inventory", "modules/sales", "server"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"